<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c0a15"><title>Le Grand Blind Test du LESLIE'S BRUNCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#1c0a15; --bg2:#2a0f20; --card:#33142a; --line:#4d2340;
  --rose:#e8457f; --rose-l:#f7b6cc; --or:#d9ae4e; --or-l:#f3dc9b;
  --txt:#fff4f8; --mut:#d3a9bf; --ok:#3ccf8e; --ko:#ff5a5a;
  --fd:'Playfair Display',Georgia,serif; --fs:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#4a1636 0%,var(--bg) 60%) fixed,var(--bg);color:var(--txt);font-family:var(--fs);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.gold{background:linear-gradient(180deg,#fff3c4 0%,var(--or) 55%,#a87a1e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-family:var(--fd);text-align:center;line-height:1.05}
.logo .l1{font-size:1rem;letter-spacing:.35em;text-transform:uppercase;color:var(--rose-l);font-family:var(--fs);font-weight:600}
.logo .l2{font-size:2.2rem;font-weight:900}
.logo .l3{font-size:1.15rem;font-style:italic;color:var(--rose)}
.btn{padding:.8rem 1.1rem;border-radius:14px;font-weight:800;font-size:.95rem;background:var(--card);border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.15)}
.btn.rose{background:linear-gradient(135deg,#ff6fa3,var(--rose));border:0;box-shadow:0 6px 20px #e8457f55}
.btn.or{background:linear-gradient(135deg,#f3dc9b,var(--or));color:#3a2408;border:0;box-shadow:0 6px 20px #d9ae4e44}
.btn.ok{background:var(--ok);color:#06301d;border:0}
.btn.ko{background:var(--ko);color:#3a0505;border:0}
.btn:disabled{opacity:.35;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#888}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.wait{background:var(--or);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.sparkle{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#f3dc9b99,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#f7b6cc99,transparent),radial-gradient(2px 2px at 40% 80%,#f3dc9b77,transparent),radial-gradient(1.5px 1.5px at 85% 65%,#fff8,transparent),radial-gradient(2px 2px at 10% 70%,#f7b6cc77,transparent);animation:tw 4s ease-in-out infinite alternate;z-index:0}
@keyframes tw{to{opacity:.35}}

/* ---------- Joueur ---------- */
.player{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));gap:14px;max-width:520px;margin:0 auto}
.player .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.player .top .mini{font-family:var(--fd);font-weight:900;font-size:1rem}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center}
.field{width:100%;padding:1rem;border-radius:14px;border:2px solid var(--line);background:#00000040;color:var(--txt);font-size:1.2rem;text-align:center;font-weight:600}
.field:focus{outline:none;border-color:var(--or)}
.teamban{border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;color:#fff;text-shadow:0 1px 3px #0006}
.teamban .sc{font-family:var(--fd);font-size:1.8rem}
.buzzer{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;font-family:var(--fd);font-weight:900;font-size:3rem;color:#fff;text-shadow:0 3px 8px #0007;background:radial-gradient(circle at 35% 30%,#ffffff55,transparent 45%),var(--tc,#555);box-shadow:0 14px 0 color-mix(in srgb,var(--tc,#555) 55%,#000),0 20px 40px #0008,inset 0 -8px 20px #0004;transition:transform .06s,box-shadow .06s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.buzzer.live{animation:pulse 1s infinite}
.buzzer:active,.buzzer.pressed{transform:translateY(10px);box-shadow:0 4px 0 color-mix(in srgb,var(--tc,#555) 55%,#000),0 8px 20px #0008}
.buzzer.off{filter:grayscale(.85) brightness(.55)}
@keyframes pulse{50%{box-shadow:0 14px 0 color-mix(in srgb,var(--tc) 55%,#000),0 0 60px var(--tc),inset 0 -8px 20px #0004}}
.status{font-size:1.25rem;font-weight:800;min-height:3.2em;display:flex;align-items:center;justify-content:center;padding:0 8px}
.chrono{font-family:var(--fd);font-weight:900;font-size:2.4rem}
.chrono.hot{color:var(--ko);animation:blink .5s infinite}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scores div{border-radius:10px;padding:6px 4px;text-align:center;font-size:.7rem;font-weight:700;background:#00000035;border-top:4px solid var(--c)}
.scores b{display:block;font-family:var(--fd);font-size:1.3rem}
.overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:var(--bg)}
.roulette{font-family:var(--fd);font-weight:900;font-size:2.4rem;padding:24px 28px;border-radius:24px;min-width:80%;transition:background .1s}
.flash{animation:flash .6s 3}
@keyframes flash{50%{filter:brightness(1.8)}}
.mut{color:var(--mut)}
.link{background:none;color:var(--mut);text-decoration:underline;font-size:.85rem}

/* ---------- Animateur ---------- */
.host{position:relative;z-index:1;padding:14px;display:grid;gap:14px;grid-template-columns:1fr;max-width:1500px;margin:0 auto}
@media(min-width:1100px){.host{grid-template-columns:330px 1fr 400px}.host header{grid-column:1/-1}}
.host header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.host header .logo{text-align:left}
.host header .logo .l2{font-size:1.5rem}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:#2a0f20cc;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-family:var(--fd);font-size:1.15rem;color:var(--or-l);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcard{border-radius:14px;padding:10px;background:#00000030;border-left:6px solid var(--c);display:flex;flex-direction:column;gap:8px}
.tcard .tr{display:flex;align-items:center;gap:8px}
.tcard input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--txt);font-weight:800;font-size:1rem;padding:2px}
.tcard .score{font-family:var(--fd);font-size:2rem;font-weight:900;min-width:2ch;text-align:center}
.mb{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.78rem;font-weight:700;padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--c,#666) 35%,transparent);border:1px solid var(--c,#666);display:inline-flex;gap:5px;align-items:center;cursor:pointer;user-select:none}
.chip.offl{opacity:.4}
.chip .x{opacity:.6;font-weight:900}
.board{border-radius:18px;padding:18px;text-align:center;background:#00000040;border:2px solid var(--line);min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px;transition:background .2s}
.board .big{font-family:var(--fd);font-size:2.2rem;font-weight:900}
.board.buzzed{background:var(--c);border-color:#fff;color:#fff;text-shadow:0 2px 6px #0007}
.board.open{border-color:var(--ok);box-shadow:0 0 30px #3ccf8e44}
.grid-sfx{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid-sfx .btn{padding:.75rem .5rem;font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;padding:.45rem .7rem;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.8rem}
.tabs button.on{background:var(--rose);border-color:var(--rose)}
.tlist{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.tlist button{display:flex;gap:8px;text-align:left;padding:.45rem .6rem;border-radius:10px;background:transparent;font-size:.85rem}
.tlist button.on{background:var(--card);outline:1px solid var(--or)}
.tlist .masked{filter:blur(5px)}
.fiche{border-radius:14px;padding:14px;background:linear-gradient(135deg,#3b1530,#2a0f20);border:1px solid var(--or);display:flex;flex-direction:column;gap:8px}
.fiche .ans{font-family:var(--fd);font-size:1.4rem;font-weight:900}
.fiche .hidden{filter:blur(9px);user-select:none}
.rule{font-size:.85rem;color:var(--or-l);background:#d9ae4e18;border-radius:10px;padding:8px 10px}
.modal{position:fixed;inset:0;background:#000c;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--or);border-radius:20px;padding:20px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.qr{background:#fff;border-radius:16px;padding:10px;display:inline-block}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}
.url{font-size:.75rem;word-break:break-all;color:var(--mut)}

/* ---------- Écran TV ---------- */
.tv{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:3vh 4vw;gap:2vh;overflow:hidden}
.tv .logo .l2{font-size:5.5vh}.tv .logo .l1{font-size:2vh}.tv .logo .l3{font-size:3vh}
.tv .stage{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2vh;text-align:center;min-height:0}
.tv .tscores{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw}
.tv .tscores div{border-radius:2vh;padding:1.5vh;text-align:center;background:#00000045;border-top:1vh solid var(--c);font-weight:800;font-size:2.4vh}
.tv .tscores b{display:block;font-family:var(--fd);font-size:7vh;line-height:1.1}
.tv .tscores .lead{box-shadow:0 0 40px var(--c)}
.tv .huge{font-family:var(--fd);font-weight:900;font-size:11vh;line-height:1}
.tv .mid{font-family:var(--fd);font-weight:900;font-size:6vh}
.tv .sub{font-size:3vh;font-weight:600;color:var(--rose-l)}
.tv .buzzfull{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);color:#fff;text-shadow:0 4px 14px #0008;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.15);opacity:0}}
.tv .qrbig{background:#fff;border-radius:2vh;padding:1.5vh;width:38vh}
.tv .qrbig img{width:100%;display:block;image-rendering:pixelated}
.tv .names{display:flex;flex-wrap:wrap;gap:1vh;justify-content:center;max-width:80vw}
.tv .names span{padding:.8vh 1.6vh;border-radius:99px;background:var(--card);font-weight:700;font-size:2.4vh;animation:pop .4s}
.tv .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;width:100%}
.tv .cols .col{border-radius:2vh;padding:2vh;background:#00000040;border-top:1vh solid var(--c);min-height:40vh;display:flex;flex-direction:column;gap:1.2vh}
.tv .cols h3{font-family:var(--fd);font-size:3.6vh}
.tv .cols span{font-size:3vh;font-weight:700;animation:pop .4s}
.tv .answer{border:.4vh solid var(--or);border-radius:3vh;padding:4vh 6vw;background:linear-gradient(135deg,#3b1530,#1c0a15);animation:pop .5s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:100%}
.podium .p{flex:1;max-width:22vw;border-radius:2vh 2vh 0 0;background:var(--c);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;padding-top:2vh;color:#fff;text-shadow:0 2px 6px #0007;animation:rise 1s ease-out both}
.podium .p .r{font-family:var(--fd);font-size:8vh;font-weight:900}
.podium .p .n{font-size:3vh;font-weight:800}
.podium .p .s{font-size:4vh;font-family:var(--fd)}
@keyframes rise{from{transform:translateY(100%)}}
.tvhint{position:fixed;bottom:8px;right:12px;font-size:12px;color:#fff5;z-index:9}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.jrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.jbtn{padding:.6rem .3rem;border-radius:12px;font-weight:800;font-size:.8rem;background:linear-gradient(135deg,#f3dc9b,var(--or));color:#3a2408;line-height:1.2}
.jbtn.used{background:#ffffff14;color:#fff5;text-decoration:line-through}
.jbtn.act{box-shadow:0 0 0 3px #fff,0 0 20px var(--or)}
.erow{display:flex;justify-content:space-between;gap:6px}
.erow button{flex:1;font-size:1.6rem;padding:.35rem 0;border-radius:12px;background:#ffffff10}
.erow button:active{transform:scale(1.25)}
.qgrid{display:grid;grid-template-columns:1fr;gap:10px;width:100%}
.qopt{padding:1rem;border-radius:16px;font-weight:800;font-size:1.05rem;text-align:left;display:flex;gap:12px;align-items:center;color:#fff;text-shadow:0 1px 3px #0006;border:3px solid transparent}
.qopt .L{font-family:var(--fd);font-size:1.6rem;width:1.6em;flex:none;text-align:center}
.qopt.sel{border-color:#fff;box-shadow:0 0 18px #fff8}
.qopt.dim{opacity:.35}
.qopt.good{border-color:var(--ok);box-shadow:0 0 22px var(--ok);opacity:1}
.QA{background:#e8457f}.QB{background:#c9962a}.QC{background:#8e4fc0}.QD{background:#2f8fc9}
.bet{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
.bet input[type=range]{width:100%;accent-color:var(--or)}
.bet .amt{font-family:var(--fd);font-size:3.2rem;font-weight:900}
.jicons{display:flex;gap:4px;font-size:.75rem}
.jicons span{padding:2px 6px;border-radius:8px;background:#d9ae4e30;border:1px solid var(--or)}
.jicons span.used{opacity:.3;text-decoration:line-through}
.jicons span.on{background:var(--or);color:#3a2408;font-weight:800}
.mini-in{background:#00000040;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:.45rem .5rem;font-size:.8rem;min-width:0}
details.cfg summary{cursor:pointer;color:var(--mut);font-size:.85rem}
details.cfg .hrow{margin-top:8px}
#ytlocal{position:fixed;right:0;bottom:0;width:240px;height:135px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}
#ytlocal.on{position:static;width:100%;height:auto;aspect-ratio:16/9;opacity:1;pointer-events:auto;z-index:auto;border-radius:12px;background:#000}
.srcb{font-size:.75rem}
.btn.sm{padding:.5rem .7rem;font-size:.8rem}
.btn.hl{outline:3px solid #fff}
/* TV */
#ytl{position:fixed;inset:0;z-index:0;opacity:0;pointer-events:none;transition:opacity .6s;background:#000}
#ytl.show{opacity:1;z-index:4}
#ytl > div,#ytl iframe{width:100%;height:100%}
#emo{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#emo .fe{position:absolute;bottom:-12vh;display:flex;flex-direction:column;align-items:center;animation:floatup 3.6s ease-out forwards}
#emo .fe b{font-size:9vh;line-height:1}
#emo .fe i{font-style:normal;font-size:1.8vh;font-weight:800;padding:.3vh 1vh;border-radius:99px;color:#fff;background:var(--c)}
@keyframes floatup{to{transform:translateY(-95vh) rotate(var(--r));opacity:0}}
#ban{position:fixed;left:50%;top:3vh;transform:translateX(-50%);z-index:30;pointer-events:none}
#ban .b{padding:2vh 4vw;border-radius:3vh;font-family:var(--fd);font-weight:900;font-size:5vh;color:#fff;text-shadow:0 2px 8px #0008;background:var(--c);box-shadow:0 0 60px var(--c);animation:pop .4s,fadeo .6s 3.6s forwards;white-space:nowrap}
@keyframes fadeo{to{opacity:0;transform:scale(.9)}}
.tv .qtv{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw;width:90%}
.tv .qtv .qopt{font-size:3.4vh;padding:2.5vh 2vw;border-radius:2.5vh;border-width:.5vh}
.tv .qtv .qopt .L{font-size:5vh}
.tv .qtv .tags{display:flex;gap:.6vw;margin-left:auto}
.tv .qtv .tags span{width:3.4vh;height:3.4vh;border-radius:50%;background:var(--c);border:.3vh solid #fff}
.tv .bets{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw;width:90%}
.tv .bets div{border-radius:2vh;padding:3vh 1vh;background:#00000050;border-top:1vh solid var(--c);text-align:center;font-weight:800;font-size:2.6vh}
.tv .bets b{display:block;font-family:var(--fd);font-size:8vh}
#snd{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:center;justify-content:center;font-size:3vh;font-weight:800;cursor:pointer;text-align:center;padding:4vh}
.lesrow{display:flex;flex-wrap:wrap;gap:6px}

/* Leslie v2 : visage rond + corps */
#les{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#les:not(:empty){background:radial-gradient(circle at 50% 45%,#1c0a1599,#000d 75%)}
#les .chr{display:flex;flex-direction:column;align-items:center;animation:lesIn .7s cubic-bezier(.3,1.6,.5,1) both}
#les.out .chr{animation:lesOut .55s ease-in forwards}
#les .fig{display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
#les .hd{width:21vh;height:21vh;position:relative;z-index:2;margin-bottom:-1.4vh;transform-origin:50% 95%}
#les .hd img{width:100%;height:100%;border-radius:50%;display:block;border:.8vh solid #fff;box-shadow:0 0 0 1.1vh var(--lc),0 1.5vh 3vh #0009;box-sizing:border-box;background:#fff}
#les .hd .dec{position:absolute;right:-3.5vh;top:-3vh;font-size:7vh;filter:drop-shadow(0 .4vh .6vh #0008);animation:decb .7s ease-in-out infinite alternate}
@keyframes decb{to{transform:rotate(12deg) scale(1.12)}}
#les svg.bd{width:34vh;height:42vh;overflow:visible;position:relative;z-index:3;transform-origin:50% 95%}
#les .cap{margin-top:.4vh;max-width:84vw;background:#ff4f73;border:.6vh solid #fff;border-radius:2.2vh;padding:1.1vh 3.5vh;font-family:var(--fs);font-weight:800;font-size:5.2vh;color:#fff;text-transform:uppercase;text-align:center;line-height:1.08;
  text-shadow:-.35vh -.35vh 0 #3b1a8f,.35vh -.35vh 0 #3b1a8f,-.35vh .35vh 0 #3b1a8f,.35vh .35vh 0 #3b1a8f,0 .5vh 1vh #0006;box-shadow:0 1vh 3vh #0008;animation:capIn .5s .35s both}
#les .cf{position:absolute;top:-8vh;animation:cfall 2.8s linear forwards}
@keyframes cfall{to{transform:translateY(118vh) rotate(540deg)}}
@keyframes lesIn{from{transform:translateY(80vh) scale(.6)}}
@keyframes lesOut{to{transform:translateY(90vh) scale(.6);opacity:0}}
@keyframes capIn{from{transform:scale(0) rotate(-8deg)}}
#les g,#les .cp{transform-box:view-box}
#les .la{transform-origin:62px 32px}#les .ra{transform-origin:138px 32px}#les .ll{transform-origin:82px 168px}#les .rl{transform-origin:118px 168px}
#les .cp{transform-origin:100px 95px;animation:pulse2 .45s ease-in-out infinite alternate}
@keyframes pulse2{to{transform:scale(1.25)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes bob{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-1.5vh)}}
@keyframes bounce{to{transform:translateY(-1.5vh)}}
@keyframes kick{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes shake{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
/* danse */
.p-dance .la{animation:laD .5s ease-in-out infinite alternate}.p-dance .ra{animation:raD .5s ease-in-out infinite alternate-reverse}
.p-dance .ll{animation:kick .5s ease-in-out infinite alternate}.p-dance .rl{animation:kick .5s ease-in-out infinite alternate-reverse}
.p-dance svg.bd{animation:sway .5s ease-in-out infinite alternate}.p-dance .hd{animation:bob .5s ease-in-out infinite alternate}
@keyframes laD{from{transform:rotate(20deg)}to{transform:rotate(125deg)}}
@keyframes raD{from{transform:rotate(-20deg)}to{transform:rotate(-125deg)}}
/* pouce levé */
.p-thumb .ra{animation:armUp .45s .2s ease-out both}.p-thumb .la{transform:rotate(-30deg)}
.p-thumb .fig{animation:bounce .4s .6s ease-in-out infinite alternate}.p-thumb .hd{transform:rotate(-6deg)}
@keyframes armUp{from{transform:rotate(0)}to{transform:rotate(-125deg)}}
/* applaudit */
.p-clap .la{animation:clL .14s ease-in-out infinite alternate}.p-clap .ra{animation:clR .14s ease-in-out infinite alternate}
.p-clap .fig{animation:bounce .35s ease-in-out infinite alternate}
@keyframes clL{from{transform:rotate(-58deg)}to{transform:rotate(-30deg)}}
@keyframes clR{from{transform:rotate(58deg)}to{transform:rotate(30deg)}}
/* cœur */
.p-heart .la{transform:rotate(-48deg)}.p-heart .ra{transform:rotate(48deg)}.p-heart .hd{animation:bob .6s ease-in-out infinite alternate}
/* toupie */
.p-spin .fig{animation:spinY 1s .3s ease-in-out 3}
.p-spin .la{transform:rotate(100deg)}.p-spin .ra{transform:rotate(-100deg)}
@keyframes spinY{to{transform:rotateY(360deg)}}
/* reine / bras en V */
.p-queen .la{animation:vL .6s ease-in-out infinite alternate}.p-queen .ra{animation:vR .6s ease-in-out infinite alternate}
.p-queen .fig{animation:jump .6s ease-in-out infinite alternate}
@keyframes vL{from{transform:rotate(110deg)}to{transform:rotate(140deg)}}
@keyframes vR{from{transform:rotate(-110deg)}to{transform:rotate(-140deg)}}
@keyframes jump{to{transform:translateY(-2.5vh)}}
/* non, mains sur les hanches */
.p-no .la{transform:rotate(-40deg)}.p-no .ra{transform:rotate(40deg)}
.p-no .hd{animation:shake .3s ease-in-out .8s 8 alternate}
.p-no .rl{animation:kick .35s ease-in-out infinite alternate;}
/* facepalm */
.p-facepalm .la{animation:palm .5s .3s ease-out both}.p-facepalm .ra{transform:rotate(-25deg)}
.p-facepalm .hd{animation:shake .6s 1s ease-in-out 4 alternate}
@keyframes palm{to{transform:rotate(158deg)}}
/* bisou */
.p-kiss .ra{animation:kissA .6s ease-in-out infinite alternate}.p-kiss .la{transform:rotate(-25deg)}.p-kiss .hd{transform:rotate(8deg)}
@keyframes kissA{from{transform:rotate(-150deg)}to{transform:rotate(-85deg)}}
/* bras croisés */
.p-cross .la{transform:rotate(-62deg)}.p-cross .ra{transform:rotate(62deg)}
.p-cross .hd{animation:shake .35s .6s ease-in-out 7 alternate}.p-cross .rl{animation:kick .3s ease-in-out infinite alternate}
/* haussement d'épaules */
.p-shrug .la{animation:shL .7s ease-in-out infinite alternate}.p-shrug .ra{animation:shR .7s ease-in-out infinite alternate}
.p-shrug svg.bd{animation:bounce .7s ease-in-out infinite alternate}.p-shrug .hd{transform:rotate(-10deg)}
@keyframes shL{from{transform:rotate(55deg)}to{transform:rotate(80deg)}}
@keyframes shR{from{transform:rotate(-55deg)}to{transform:rotate(-80deg)}}
/* stop */
.p-stop .ra{animation:armUp2 .45s .3s ease-out both}.p-stop .la{transform:rotate(-30deg)}.p-stop .hd{transform:rotate(-8deg)}
@keyframes armUp2{to{transform:rotate(-110deg)}}
/* doigt qui gronde */
.p-point .ra{animation:wag .25s ease-in-out infinite alternate}.p-point .la{transform:rotate(-40deg)}.p-point .hd{transform:rotate(6deg)}
@keyframes wag{from{transform:rotate(-140deg)}to{transform:rotate(-115deg)}}
/* affaissée */
.p-slump svg.bd{animation:slump 1.2s .4s ease-in-out both}.p-slump .hd{animation:droop 1.2s .4s ease-in-out both}
.p-slump .la{transform:rotate(-8deg)}.p-slump .ra{transform:rotate(8deg)}
@keyframes slump{to{transform:scaleY(.86) translateY(1vh)}}
@keyframes droop{to{transform:rotate(18deg) translateY(4vh)}}
/* se frotte les mains */
.p-rub .la{animation:rubL .16s ease-in-out infinite alternate}.p-rub .ra{animation:rubR .16s ease-in-out infinite alternate}
.p-rub .fig{animation:bounce .45s ease-in-out infinite alternate}
@keyframes rubL{from{transform:rotate(-50deg)}to{transform:rotate(-38deg)}}
@keyframes rubR{from{transform:rotate(50deg)}to{transform:rotate(38deg)}}
/* apéro */
.p-apero .ra{transform:rotate(-95deg)}.p-apero .la{animation:laSlow 1.2s ease-in-out infinite alternate}
.p-apero .fig{animation:sway 1.2s ease-in-out infinite alternate}
@keyframes laSlow{from{transform:rotate(10deg)}to{transform:rotate(35deg)}}
</style></head><body><div id="app"></div>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

function chord(fs,t,d,type='triangle',vol=.12){ fs.forEach(f=>tone(f,t,d,type,vol)); }
function sweep(t,d,vol,f1,f2,q=2,type='bandpass'){ // bruit filtré avec balayage de fréquence (whoosh, scratch)
  const c=ac(), s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(), t0=c.currentTime+t;
  s.buffer=noiseBuf(); s.loop=true; f.type=type; f.Q.value=q; f.frequency.setValueAtTime(f1,t0); f.frequency.exponentialRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+d*0.4); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(f); f.connect(g); g.connect(MASTER); s.start(t0); s.stop(t0+d+0.05);
}
function vibTone(f,t,d,{type='sine',vol=.2,rate=6,depth=10,slide=null,filter=null,q=1}={}){ // ton avec vibrato (sifflet, tuba, voix)
  const c=ac(), o=c.createOscillator(), l=c.createOscillator(), lg=c.createGain(), g=c.createGain(), t0=c.currentTime+t;
  o.type=type; o.frequency.setValueAtTime(f,t0); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+d);
  l.frequency.value=rate; lg.gain.value=depth; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.03); g.gain.setValueAtTime(vol,t0+d*0.75); g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  let last=o; if(filter){ const fl=c.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=filter; fl.Q.value=q; o.connect(fl); last=fl; }
  last.connect(g); g.connect(MASTER); o.start(t0); l.start(t0); o.stop(t0+d+0.05); l.stop(t0+d+0.05);
}
function kick(t,vol=.5){ tone(150,t,.25,'sine',vol,45); }
function clap(t,vol=.3){ noise(t,.12,vol,1500,.8); noise(t+.01,.1,vol*.7,2500,.8); }
function hat(t,vol=.08){ noise(t,.04,vol,8000,.5,'highpass'); }
function crowd(t,d,base,{slideTo=null,filt=900,vol=.05,n=12}={}){ // foule « ooh / aah »
  for(let i=0;i<n;i++){ const f=base*(0.85+Math.random()*0.5); vibTone(f,t+Math.random()*.15,d,{type:'sawtooth',vol,rate:4+Math.random()*3,depth:f*0.02,slide:slideTo?f*slideTo:null,filter:filt,q:1.2}); }
}
function happyMelody(beat,voice){ const G=N.G4,A=N.A4,B=N.B4,C=N.C5,D=N.D5,E=N.E5,F=N.F5,G5=N.G5;
  const m=[[G,.75],[G,.25],[A,1],[G,1],[C,1],[B,2],[G,.75],[G,.25],[A,1],[G,1],[D,1],[C,2],[G,.75],[G,.25],[G5,1],[E,1],[C,1],[B,1],[A,2],[F,.75],[F,.25],[E,1],[C,1],[D,1],[C,3]];
  let t=0; m.forEach(([f,d])=>{ voice(f,t,d*beat); t+=d*beat; }); return t; }

const LES_PROP={apero:'🍹',stop:'✋',thumb:'👍',point:'👆',kiss:'💋'};
function leslieBody(color,pose){
  const skin='#f1c3a5', o='#5a2a3a';
  const pr=LES_PROP[pose]?`<text x="178" y="118" font-size="40" text-anchor="middle">${LES_PROP[pose]}</text>`:'';
  const arm=(cls,x1,x2,extra='')=>`<g class="${cls}"><line x1="${x1}" y1="32" x2="${x2}" y2="104" stroke="${o}" stroke-width="18" stroke-linecap="round"/><line x1="${x1}" y1="32" x2="${x2}" y2="104" stroke="${skin}" stroke-width="12" stroke-linecap="round"/><circle cx="${x2}" cy="106" r="11" fill="${skin}" stroke="${o}" stroke-width="3"/>${extra}</g>`;
  const leg=(cls,x1,x2,sx)=>`<g class="${cls}"><line x1="${x1}" y1="168" x2="${x2}" y2="228" stroke="${o}" stroke-width="17" stroke-linecap="round"/><line x1="${x1}" y1="168" x2="${x2}" y2="228" stroke="${skin}" stroke-width="11" stroke-linecap="round"/><ellipse cx="${sx}" cy="233" rx="17" ry="9" fill="#c2185b" stroke="${o}" stroke-width="3"/></g>`;
  const chest=pose==='heart'?'<text class="cp" x="100" y="110" font-size="56" text-anchor="middle">💖</text>':'';
  return `<svg class="bd" viewBox="0 0 200 250" aria-hidden="true">${leg('ll',82,78,72)}${leg('rl',118,122,128)}
   <rect x="88" y="-6" width="24" height="26" rx="7" fill="${skin}" stroke="${o}" stroke-width="3"/>
   <path d="M58 22 Q100 8 142 22 L168 172 Q100 190 32 172 Z" fill="${color}" stroke="${o}" stroke-width="4"/>
   <path d="M66 70 Q100 80 134 70" stroke="#fff9" stroke-width="5" fill="none"/>
   <circle cx="80" cy="120" r="5" fill="#fff7"/><circle cx="118" cy="135" r="5" fill="#fff7"/><circle cx="96" cy="155" r="5" fill="#fff7"/><circle cx="130" cy="105" r="4" fill="#fff7"/><circle cx="70" cy="150" r="4" fill="#fff7"/>
   ${chest}${arm('la',62,24)}${arm('ra',138,176,pr)}</svg>`;
}
// Sac de variantes : chaque variante 2 fois max, jamais deux fois de suite
function lesNext(k){
  const n=LES_MOMENTS[k].v.length; if(n===1) return 0;
  let bag; try{ bag=JSON.parse(localStorage.getItem('lbt-bag-'+k)||'null'); }catch(e){}
  if(!Array.isArray(bag)){ bag=[]; for(let r=0;r<2;r++){ const a=[...Array(n).keys()]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } if(bag.length&&bag[bag.length-1]===a[0]) a.push(a.shift()); bag.push(...a); } }
  if(!bag.length) return null;
  const v=bag.shift(); try{ localStorage.setItem('lbt-bag-'+k,JSON.stringify(bag)); }catch(e){} return v;
}
function lesResetBags(){ try{ Object.keys(LES_MOMENTS).forEach(k=>localStorage.removeItem('lbt-bag-'+k)); }catch(e){} }
function lesLeft(k){ try{ const b=JSON.parse(localStorage.getItem('lbt-bag-'+k)||'null'); return Array.isArray(b)?b.length:LES_MOMENTS[k].v.length*2; }catch(e){ return 0; } }
let LES_T=null;
function leslieShow(k,vi=0){
  const M=LES_MOMENTS[k]; if(!M) return; const m=M.v[vi]||M.v[0];
  let box=document.getElementById('les'); if(!box){ box=document.createElement('div'); box.id='les'; document.body.appendChild(box); }
  clearTimeout(LES_T); box.className='';
  box.innerHTML=`<div class="chr p-${m.p}" style="--lc:${m.c}"><div class="fig"><div class="hd"><img alt="" src="${LES_FACE[m.f]}"><span class="dec">${m.d}</span></div>${leslieBody(m.c,m.p)}</div><div class="cap">${esc(m.t)}</div></div>`;
  if(['queen','dance','spin','heart','kiss'].includes(m.p)){ const set=m.p==='kiss'?['💋','💗','💋']:m.p==='heart'?['💖','💗','💕']:['🎉','✨','💗','⭐','🎊'];
    for(let i=0;i<26;i++){ const e=document.createElement('div'); e.className='cf'; e.textContent=set[i%set.length]; e.style.left=(Math.random()*100)+'vw'; e.style.animationDelay=(Math.random()*1.2)+'s'; e.style.fontSize=(3+Math.random()*3)+'vh'; box.appendChild(e); } }

let YTP_LOADING=null;
function ytApi(){ if(window.YT&&window.YT.Player) return Promise.resolve(); if(YTP_LOADING) return YTP_LOADING;
  YTP_LOADING=new Promise(res=>{ const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); res(); }; const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); });
  return YTP_LOADING; }
function makeYT(elId,onEvt){
  let p=null, ready=false, q=[], stopT=null, durWanted=null, startedAt=0, cur=null;
  ytApi().then(()=>{ p=new YT.Player(elId,{width:'100%',height:'100%',playerVars:{controls:0,disablekb:1,rel:0,playsinline:1,iv_load_policy:3,modestbranding:1,fs:0},
    events:{onReady:()=>{ ready=true; q.forEach(f=>f()); q=[]; },
      onError:e=>{ onEvt&&onEvt({type:'yterr',code:e.data,id:cur&&cur.id}); },
      onStateChange:e=>{ if(e.data===1&&durWanted!=null){ clearTimeout(stopT); const d=durWanted; durWanted=null; stopT=setTimeout(()=>{ try{p.pauseVideo();}catch(err){} onEvt&&onEvt({type:'ytdone'}); },d*1000); } onEvt&&onEvt({type:'ytstate',s:e.data}); }}}); });
  const run=f=>{ if(ready) f(); else q.push(f); };
  let prep=null, prepT=null;
  function stopPrep(){ clearInterval(prepT); prepT=null; }
  return {
    // Charge la vidéo en muet et la laisse tourner jusqu'à la fin de la pub, puis la met en pause au point de départ
    preload(id,start=0){ run(()=>{ stopPrep(); clearTimeout(stopT); durWanted=null; prep={id,start,ok:false}; cur={id,start}; p.mute(); p.loadVideoById({videoId:id,startSeconds:start}); const t0=Date.now();
      prepT=setInterval(()=>{ let ct=0, stt=-1; try{ ct=p.getCurrentTime(); stt=p.getPlayerState(); }catch(e){}
        if(stt===1&&ct>start+0.4){ stopPrep(); p.pauseVideo(); p.seekTo(start,true); prep.ok=true; onEvt&&onEvt({type:'ytprep',id,ok:true}); }
        else if(Date.now()-t0>90000){ stopPrep(); onEvt&&onEvt({type:'ytprep',id,ok:false}); } },300);
      onEvt&&onEvt({type:'ytprep',id,ok:false,loading:true}); }); },
    play(id,start=0,{dur=null,rate=1}={}){ run(()=>{ clearTimeout(stopT); durWanted=dur; cur={id,start};
      if(prep&&prep.id===id&&prep.ok){ stopPrep(); p.seekTo(start,true); try{p.setPlaybackRate(rate);}catch(e){} p.unMute(); p.setVolume(100); p.playVideo(); return; }
      stopPrep(); prep=null; p.loadVideoById({videoId:id,startSeconds:start}); try{p.setPlaybackRate(rate);}catch(e){} p.unMute(); p.setVolume(100); }); },
    pause(){ run(()=>{ clearTimeout(stopT); durWanted=null; p.pauseVideo(); }); },
    resume(){ run(()=>{ p.playVideo(); }); },
    stop(){ run(()=>{ clearTimeout(stopT); durWanted=null; if(prep&&prep.ok){ p.pauseVideo(); p.seekTo(prep.start,true); p.mute(); } else if(!prepT){ p.stopVideo(); } }); },
    restart(){ run(()=>{ if(cur){ p.seekTo(cur.start,true); p.unMute(); p.playVideo(); } }); },
    state(){ try{ return p?p.getPlayerState():-1; }catch(e){ return -1; } }
  };
}

function Player(){
  const hostId=Q.get('join');
  const me=ls.get('lbt-me',null)||{pid:rid(10),name:''};
  let S=null, conn=null, peer=null, connected=false, lastPong=0, retryT=null, drawSeen=ls.get('lbt-draw',0), pressed=false, timerLeft=null, timerAt=0, lastEmo=0, betVal=null, picking=false;
  app.innerHTML=`<div class="sparkle"></div><div class="player" id="pl"></div><div id="ov"></div>`;
  const pl=$('#pl');
  if(!me.name) askName(); else start();
  const send=o=>{ try{ if(conn&&conn.open) conn.send(o); }catch(e){} };

  function askName(){
    pl.innerHTML=`<div class="center">${LOGO()}<p class="mut">Entrez votre prénom pour rejoindre le plateau</p>
    <input class="field" id="nm" maxlength="18" placeholder="Votre prénom" autocomplete="off"><button class="btn rose" id="go" style="width:100%;font-size:1.2rem">Je rejoins le jeu ✨</button></div>`;
    const go=()=>{ const v=$('#nm').value.trim().slice(0,18); if(!v) return $('#nm').focus(); me.name=v; ls.set('lbt-me',me); start(); };
    $('#go').onclick=go; $('#nm').onkeydown=e=>{ if(e.key==='Enter') go(); };
  }
  function start(){
    render(); keepAwake();
    peer=new Peer(peerOpts());
    peer.on('open',openConn);
    peer.on('disconnected',()=>{ setTimeout(()=>{ if(peer.disconnected&&!peer.destroyed) peer.reconnect(); },1500); });
    peer.on('error',e=>{ connected=false; render(); retry(e.type==='peer-unavailable'?3000:2500); });
    setInterval(()=>{ if(connected&&conn){ send({type:'ping'}); if(Date.now()-lastPong>12000){ connected=false; try{conn.close();}catch(e){} retry(500);} } },4000);
    setInterval(tickTimer,250);
  }
  function retry(ms){ clearTimeout(retryT); retryT=setTimeout(()=>{ if(peer.destroyed) return; if(peer.disconnected){ peer.reconnect(); return; } openConn(); },ms); }
  function openConn(){
    if(conn){ try{conn.close();}catch(e){} }
    const c=conn=peer.connect('lbt-'+hostId,{reliable:true});
    c.on('open',()=>{ if(c!==conn) return; connected=true; lastPong=Date.now(); c.send({type:'hello',pid:me.pid,name:me.name}); render(); });
    c.on('data',d=>{ if(c!==conn) return; lastPong=Date.now(); if(d&&d.type==='state') onState(d); });
    c.on('close',()=>{ if(c!==conn) return; connected=false; render(); retry(2000); });
    c.on('error',()=>{ if(c!==conn) return; connected=false; render(); retry(2000); });
  }
  function onState(d){
    const prev=S; S=d;
    if(d.timer!=null){ timerLeft=d.timer; timerAt=Date.now(); } else timerLeft=null;
    if(d.status!=='open') pressed=false;
    if(d.drawStamp&&d.drawStamp!==drawSeen&&d.myTeam!=null){ drawSeen=d.drawStamp; ls.set('lbt-draw',drawSeen); roulette(d.myTeam); }
    if(d.buzzMe&&!(prev&&prev.buzzMe)) vib([60,40,200]);
    if(!d.wager||d.wager.phase!=='bet') betVal=null;
    if(picking&&document.activeElement&&document.activeElement.type==='range') return; // ne pas casser le curseur pendant la mise
    render();
  }
  function vib(p){ try{navigator.vibrate&&navigator.vibrate(p);}catch(e){} }
  async function keepAwake(){ try{ if('wakeLock' in navigator){ await navigator.wakeLock.request('screen'); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') navigator.wakeLock.request('screen').catch(()=>{}); }); } }catch(e){} }
  function tickTimer(){ const el=$('#chr'); if(!el) return; const l=curLeft(); el.textContent=l==null?'':l+' s'; el.className='chrono'+(l!=null&&l<=5?' hot':''); }
  function curLeft(){ if(timerLeft==null) return null; return Math.max(0,Math.ceil(timerLeft-(Date.now()-timerAt)/1000)); }
  function roulette(team){
    const ov=$('#ov'); let i=0, n=0; const total=22;
    ov.innerHTML=`<div class="overlay"><p class="mut">Tirage au sort des équipes…</p><div class="roulette" id="rl"></div><p id="rlt" class="status"></p></div>`;
    const step=()=>{ const t=(n<total)?(i++%4):team; const rl=$('#rl'); if(!rl) return; rl.style.background=TEAMC[t].c; rl.textContent=(S&&S.teams[t]?S.teams[t].name:TEAMC[t].n);
      if(n<total){ vib(15); n++; setTimeout(step,60+n*n*0.6); } else { rl.classList.add('flash'); vib([100,60,300]); $('#rlt').textContent='Vous êtes dans cette équipe ! 🎉'; setTimeout(()=>{ ov.innerHTML=''; },2600); } };
    step();
  }
  function blocPicker(){
    const ov=$('#ov');
    ov.innerHTML=`<div class="overlay"><div class="logo"><div class="l2 gold">🛡 Blocage</div></div><p class="mut">Quelle équipe bloquer sur ce titre ?</p><div style="display:flex;flex-direction:column;gap:10px;width:100%">${S.teams.map((t,i)=>i===S.myTeam?'':`<button class="teamban" data-bt="${i}" style="background:${t.color};border:0">${esc(t.name)}<span>›</span></button>`).join('')}</div><button class="link" id="bx">Annuler</button></div>`;
    ov.querySelectorAll('[data-bt]').forEach(b=>b.onclick=()=>{ send({type:'joker',j:'bloc',target:+b.dataset.bt}); vib(80); ov.innerHTML=''; });
    $('#bx').onclick=()=>ov.innerHTML='';
  }
  function render(){
    if(!me.name) return;
    const dot=`<span class="pill"><span class="dot ${connected?'on':'wait'}"></span>${connected?'Connecté':'Connexion…'}</span>`;
    if(!S){ pl.innerHTML=`<div class="top"><span class="mini gold">Blind Test</span>${dot}</div><div class="center">${LOGO()}<p class="status">Connexion au plateau…</p><p class="mut">Restez sur cette page, ça arrive.</p></div>`; return; }
    const top=`<div class="top"><span class="mini gold">Blind Test · Leslie's Brunch</span>${dot}</div>`;
    const scores=`<div class="scores">${S.teams.map(t=>`<div style="--c:${t.color}">${esc(t.name)}<b>${t.score}</b></div>`).join('')}</div>`;
    const emo=`<div class="erow">${EMOJIS.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div>`;
    const bindEmo=()=>pl.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{ if(Date.now()-lastEmo<1200) return; lastEmo=Date.now(); send({type:'react',e:b.dataset.e}); vib(20); b.animate([{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:300}); });
    if(S.screen==='pub'){ pl.innerHTML=top+`<div class="center"><div class="logo"><div class="l2 gold">Pause pub</div><div class="l3">Rechargez vos verres 🥂</div></div></div>`+emo+scores; bindEmo(); return; }
    if(S.screen==='podium'){ const r=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
      pl.innerHTML=top+`<div class="center">${LOGO()}<div style="width:100%;display:flex;flex-direction:column;gap:8px">${r.map((t,k)=>`<div class="teamban" style="background:${t.color}"><span>${['🥇','🥈','🥉','🎖️'][k]} ${esc(t.name)}</span><span class="sc">${t.score}</span></div>`).join('')}</div></div>`+emo; bindEmo(); return; }
    if(S.myTeam==null){ pl.innerHTML=top+`<div class="center">${LOGO()}<p class="status">Bienvenue ${esc(me.name)} !</p><p class="mut">Le tirage au sort des équipes arrive dans un instant…<br>Gardez votre téléphone allumé.</p>
      <button class="link" id="chg">Changer de prénom</button></div>`;
      $('#chg').onclick=()=>{ me.name=''; ls.set('lbt-me',me); location.reload(); }; return; }
    const t=S.teams[S.myTeam], tc=t.color;
    const ban=`<div class="teamban" style="background:${tc}"><span>${esc(t.name)} · ${esc(me.name)}</span><span class="sc">${t.score}</span></div>`;

    // --- Quitte ou double : mise
    if(S.wager&&S.wager.phase==='bet'){
      const mine=S.wager.myBet; const max=t.score; if(betVal==null) betVal=mine!=null?mine:Math.floor(max/2);
      pl.innerHTML=top+ban+`<div class="center"><div class="logo"><div class="l2 gold">💰 Quitte ou double</div></div>
        <p class="mut">Combien votre équipe mise-t-elle sur la prochaine question ?<br>Bonne réponse : on gagne la mise. Mauvaise : on la perd.</p>
        ${max<=0?'<p class="status">Votre équipe n\'a pas encore de points : mise à 0.</p>':`<div class="bet"><div class="amt" id="ba">${betVal}</div><input type="range" id="br" min="0" max="${max}" step="1" value="${Math.min(betVal,max)}">
        <div class="hrow" style="justify-content:center"><button class="btn sm" data-p="0">0</button><button class="btn sm" data-p=".5">Moitié</button><button class="btn sm" data-p="1">Tout ! 🔥</button></div>
        <button class="btn or" id="bv" style="width:100%;font-size:1.1rem">Valider la mise</button></div>`}
        <p class="status">${mine!=null?`Mise de l'équipe : <b>&nbsp;${mine} pts&nbsp;</b>${S.wager.byName?' (par '+esc(S.wager.byName)+')':''}`:'Aucune mise validée pour l\'instant'}</p></div>`+scores;
      if(max>0){ const br=$('#br'), ba=$('#ba'); br.oninput=()=>{ picking=true; betVal=+br.value; ba.textContent=betVal; };
        br.onchange=()=>{ picking=false; };
        pl.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ betVal=Math.round(max*(+b.dataset.p)); br.value=betVal; ba.textContent=betVal; });
        $('#bv').onclick=()=>{ picking=false; send({type:'bet',v:betVal}); vib(60); }; }
      return;
    }
    if(S.wager&&S.wager.phase==='reveal'){ pl.innerHTML=top+ban+`<div class="center"><div class="logo"><div class="l2 gold">💰 Les mises</div></div><div style="width:100%;display:flex;flex-direction:column;gap:8px">${S.teams.map((x,i)=>`<div class="teamban" style="background:${x.color}"><span>${esc(x.name)}</span><span class="sc">${S.wager.bets[i]??0}</span></div>`).join('')}</div><p class="mut">Préparez-vous pour la question !</p></div>`+emo; bindEmo(); return; }

    // --- QCM
    if(S.qcm){
      const q=S.qcm, mine=q.answers[S.myTeam];
      const opts=q.opts.map((o,i)=>{ let cl='qopt Q'+'ABCD'[i]; if(q.closed){ cl+=i===q.correct?' good':' dim'; if(mine&&mine.i===i) cl+=' sel'; } else if(mine){ cl+=mine.i===i?' sel':' dim'; } return `<button class="${cl}" data-q="${i}"><span class="L">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`; }).join('');
      let msg=q.closed?(mine?(mine.i===q.correct?`✅ Bravo ! +${q.gain[S.myTeam]||0} pts`:`❌ Raté…${q.gain[S.myTeam]?' '+q.gain[S.myTeam]+' pts':''}`):'⏰ Pas de réponse de votre équipe'):(mine?`Réponse de l'équipe verrouillée (par ${esc(mine.name)})`:'Concertez-vous : une seule réponse par équipe !');
      pl.innerHTML=top+ban+`<div id="chr" class="chrono" style="text-align:center"></div><div class="qgrid">${opts}</div><div class="status">${msg}</div>`+emo+scores;
      tickTimer(); bindEmo();
      if(!q.closed&&!mine) pl.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ send({type:'qcm',i:+b.dataset.q}); vib(60); pl.querySelectorAll('[data-q]').forEach(x=>x.classList.add(x===b?'sel':'dim')); });
      return;
    }

    // --- Buzzer
    const blocked=S.blocked.includes(S.myTeam);
    let label='BUZZ', msg='', cls='off', can=false;
    if(S.status==='open'&&!blocked){ cls=pressed?'live pressed':'live'; can=!pressed; msg=pressed?'Envoyé…':'À vous de jouer !'; }
    else if(S.status==='open'&&blocked){ msg=S.blocTarget===S.myTeam?'🛡 Votre équipe a été bloquée par un joker !':'Votre équipe est bloquée sur ce titre 🙊'; }
    else if(S.status==='buzzed'&&S.buzz){ if(S.buzzMe){ label='À VOUS'; cls='live pressed'; msg='🎤 C\'est vous ! Donnez la réponse !'; } else msg=`${esc(S.buzz.name)} (${esc(S.teams[S.buzz.team].name)}) a buzzé !`; }
    else msg=S.blocTarget===S.myTeam?'🛡 Votre équipe sera bloquée sur ce titre':'Écoutez bien… les buzzers vont s\'ouvrir';
    const J=S.jokers||{}, act=S.qActive||{};
    const jrow=`<div class="jrow">${Object.keys(JOKERS).map(k=>`<button class="jbtn ${J[k]?'used':''} ${act[k]?'act':''}" data-j="${k}" ${J[k]||S.status==='buzzed'?'disabled':''}>${JOKERS[k].l}</button>`).join('')}</div>`;
    pl.innerHTML=top+ban+`<div class="center" style="gap:12px"><div id="chr" class="chrono"></div><button class="buzzer ${cls}" id="bz" style="--tc:${tc}">${label}</button><div class="status">${msg}</div></div>`+jrow+emo+scores;
    tickTimer(); bindEmo();
    const bz=$('#bz');
    bz.addEventListener('pointerdown',e=>{ e.preventDefault(); if(!can||!connected) return; pressed=true; can=false; vib(70); send({type:'buzz'}); bz.classList.add('pressed'); bz.parentNode.querySelector('.status').textContent='Envoyé…'; });
    pl.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{ const k=b.dataset.j; if(J[k]) return;
      if(k==='bloc') return blocPicker();
      if(confirm(`Jouer le joker « ${JOKERS[k].l} » sur ce titre ?\n${JOKERS[k].d}. Utilisable une seule fois !`)){ send({type:'joker',j:k}); vib(80); } });
  }
}

    <h2>Leslie 💗 <label class="mut" style="font-size:.75rem;font-family:var(--fs);display:flex;gap:6px;align-items:center"><input type="checkbox" id="lesauto"> Auto pendant le jeu</label></h2><div class="lesrow" id="lesb"></div>

    <div class="tabs" id="tabs"></div><div class="rule" id="rule"></div><div class="fiche" id="fiche"></div><div id="ytlocal"><div id="ytlp"></div></div><div class="tlist" id="tlist"></div></section>
  </div><div id="modal"></div>`;

  // ---------- Musique ----------
  const ytLocal=makeYT('ytlp',d=>{ if(d.type==='yterr') onYtErr(d); if(d.type==='ytprep') onPrep(d); });
  const MP3={files:{},bufs:{},src:null,key:null,t0:0,off:0,rate:1,rev:false,paused:false,stopT:null,
    async buf(key,rev){ const k=key+(rev?':r':''); if(this.bufs[k]) return this.bufs[k]; let b=this.bufs[key]; if(!b){ b=await ac().decodeAudioData(await this.files[key].arrayBuffer()); this.bufs[key]=b; }
      if(!rev) return b; const r=ac().createBuffer(b.numberOfChannels,b.length,b.sampleRate); for(let c=0;c<b.numberOfChannels;c++){ const s=b.getChannelData(c), d=r.getChannelData(c); for(let i=0,n=s.length;i<n;i++) d[i]=s[n-1-i]; } return this.bufs[k]=r; },
    async play(key,start,{dur=null,rate=1,rev=false}={}){ this.stop(); const b=await this.buf(key,rev); this.key=key; this.rate=rate; this.rev=rev;
      this.off=rev?Math.max(0,b.duration-start-40):Math.min(start,Math.max(0,b.duration-1)); this._start(b,dur); },
    _start(b,dur){ const c=ac(), s=c.createBufferSource(); s.buffer=b; s.playbackRate.value=this.rate; s.connect(c.destination); s.start(0,this.off); this.src=s; this.t0=c.currentTime; this.paused=false;
      clearTimeout(this.stopT); if(dur) this.stopT=setTimeout(()=>this.pause(),dur*1000); },
    pause(){ if(!this.src) return; clearTimeout(this.stopT); this.off+=(ac().currentTime-this.t0)*this.rate; try{this.src.stop();}catch(e){} this.src=null; this.paused=true; },
    async resume(){ if(!this.paused||!this.key) return; const b=await this.buf(this.key,this.rev); this._start(b,null); },
    stop(){ clearTimeout(this.stopT); if(this.src){ try{this.src.stop();}catch(e){} } this.src=null; this.paused=false; this.key=null; }
  };
  const tkey=(r=st.round,k=st.track)=>r+'-'+k;

  let prepState={id:null,ok:false,loading:false};

  function music(cmd,o={}){
    const k=tkey(), has=!!MP3.files[k], id=ytOf();

    else if(cmd==='pause'){ if(musicSrc==='mp3') MP3.pause(); else if(musicSrc==='yt') yt().pause(); }

  }
  function stopAll(){ MP3.stop(); if(musicSrc==='yt'){ try{ ytLocal.stop(); }catch(e){} if(bc) bc.postMessage({type:'yt',cmd:'stop'}); } musicSrc=null; }

  function onYtErr(d){ const box=$('#yterr'); if(box) box.textContent='⚠️ Cette vidéo ne peut pas être lue ici (code '+d.code+'). Collez un autre lien YouTube dans ⚙️ Réglages du titre, ou utilisez un MP3.'; }

  // ---------- MP3 : chargement & association ----------
  const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const STOP=new Set(['the','les','des','une','and','of','you','from','est','qui','que','par','pour','dans','theme','version','official','officiel','clip','video','generique','feat','ft','avec','sur']);
  const toks=s=>norm(s).split(' ').filter(w=>w.length>=3&&!STOP.has(w));
  $('#mp3in').onchange=e=>{ const fs=[...e.target.files]; let n=0;
    PLAYLIST.forEach((R,r)=>R.tracks.forEach((T,k)=>{ const tt=toks(T.t.replace(/\(.*?\)/g,'')), at=toks(T.a); let best=null,bs=0;
      fs.forEach(f=>{ const fn=' '+norm(f.name.replace(/\.[^.]+$/,''))+' '; const code=`m${r+1} ${String(k+1).padStart(2,'0')}`; let sc=0;
        if(fn.includes(' '+code+' ')||fn.includes(` m${r+1}${String(k+1).padStart(2,'0')} `)) sc=10;
        const ht=tt.filter(w=>fn.includes(' '+w+' ')).length, ha=at.filter(w=>fn.includes(' '+w+' ')).length;
        if(tt.length&&ht/tt.length>=0.6) sc=Math.max(sc,2*ht/tt.length+ (at.length?ha/at.length:0));

  // ---------- Leslie
  let lesAuto=ls.get('lbt-les-auto',true);

  $('#lesb').insertAdjacentHTML('afterend','<div class="mut" id="lesleft" style="font-size:.75rem"></div>'); setTimeout(()=>renderLesLeft(),0);
  function leslie(k,auto=false,sometimes=false){ if(auto&&!lesAuto) return; if(sometimes&&Math.random()>0.34) return; let v=lesNext(k); if(v==null){ if(auto) return; v=Math.floor(Math.random()*LES_MOMENTS[k].v.length); } const sn=LES_MOMENTS[k].v[v].s; if(!auto||k==='bravo'||k==='rate'){ if(sn&&FN[sn]) setTimeout(()=>FN[sn](),auto?700:150); else if(k==='apero'&&!auto) SFX.pub(); }
    if(tvAlive()&&bc) bc.postMessage({type:'leslie',k,v}); else leslieShow(k,v); renderLesLeft(); }
  function renderLesLeft(){ const el=$('#lesleft'); if(el) el.textContent=`Restant : ${lesLeft('bravo')} bravo / ${lesLeft('rate')} raté (chaque animation max 2 fois)`; }

  // ---------- Sons
  // les 20 sons choisis par Greg (numéros de la page d'écoute)
  const KEEP=[1,4,6,8,9,12,15,17,18,19,20,25,27,28,30,35,38,39,43,44];

  $('#sfx').innerHTML=groups.map(g=>`<div style="grid-column:1/-1;font-size:.8rem;color:var(--or-l);font-weight:800;margin-top:4px">${g.cat}</div>`+g.items.map(x=>`<button class="btn" data-s="${x.num}">${esc(x.l)}</button>`).join('')).join('');

  // ---------- Écrans
  ['lobby','game','pub','podium'].forEach(s=>$('#bscr-'+s).onclick=()=>{ st.screen=s; if(s==='pub'){ stopAll(); SFX.pub(); setTimeout(()=>leslie('apero',true),1200); } if(s==='podium'){ stopAll(); SFX.victoire(); setTimeout(()=>leslie('reine',true),3200); } if(s==='game'&&st.status==='lobby') st.status='closed'; commit(); });

  // ---------- Playlist
  function renderPlaylist(){

      <div class="${peek?'':'hidden'}"><div class="ans">${esc(T.t)}</div><div style="font-weight:700">${esc(T.a)} · ${T.y}</div><div class="mut" style="font-size:.9rem;margin-top:6px">💡 ${esc(T.n)}</div></div>

        <div class="hrow"><a class="btn sm" href="${ytS}" target="_blank" rel="noopener">🔎 Chercher sur YouTube</a><label class="btn sm" style="cursor:pointer">🎵 MP3 pour ce titre<input type="file" id="c1" accept="audio/*" hidden></label></div></details>`;
    $('#tlist').innerHTML=R.tracks.map((x,i)=>`<button class="${i===st.track?'on':''}" data-k="${i}"><b>${i+1}.</b><span class="${peek?'':'masked'}">${esc(x.a)} – ${esc(x.t)}</span>${MP3.files[st.round+'-'+i]?' 🎵':''}</button>`).join('');

  function goTrack(d){ let r=st.round, k=st.track+d; if(k>=PLAYLIST[r].tracks.length){ if(r<PLAYLIST.length-1){ r++; k=0; SFX.finManche(); } else k=PLAYLIST[r].tracks.length-1; } if(k<0){ if(r>0){ r--; k=PLAYLIST[r].tracks.length-1; } else k=0; } st.round=r; st.track=k; resetQ(); commit(); }
  function resetQ(){ stopAll(); showLocal(false); if(bc) bc.postMessage({type:'yt',cmd:'hide'}); st.revealed=false; st.buzz=null; st.blocked=[]; st.qj={x2:[],chance:[],bloc:null}; st.introPts=null; if(st.qcm) st.qcm=null; if(st.status!=='lobby') st.status='closed'; timer=null; if(st.screen==='lobby'||st.screen==='draw') st.screen='game'; setTimeout(preloadCur,300); }

  // ---------- Buzzers
  function teamsWithPlayers(){ const s=new Set(); Object.values(st.players).forEach(p=>{ if(p.team!=null&&p.on) s.add(p.team); }); return s.size||4; }

    else { st.blocked.push(tm); leslie('rate',true,true); }

    J[d.j]=true; SFX.joker(); commit(); }

  // ---------- QCM
  function startQCM(){
    const R=PLAYLIST[st.round], T=curT(); const others=R.tracks.filter(x=>x!==T); for(let i=others.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [others[i],others[j]]=[others[j],others[i]]; }
    const opts=[T,...others.slice(0,3)]; for(let i=3;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }

      mid=`<div class="huge gold">💰 Quitte ou double</div><div class="sub">${S.wager.phase==='bet'?'Les équipes misent en secret sur leur téléphone…':'Les mises sont faites !'}</div><div class="bets">${S.teams.map((t,i)=>`<div style="--c:${t.color}">${esc(t.name)}<b>${S.wager.phase==='bet'?(S.wager.bets[i]?'✓':'…'):(S.wager.bets[i]??0)}</b></div>`).join('')}</div>`;
    } else if(S.qcm){ const q=S.qcm;
      mid=`<div class="sub">${q.closed?'La bonne réponse était…':'❓ QCM — une réponse par équipe'}</div><div id="tchr" class="huge" style="font-size:7vh"></div><div class="qtv">${q.opts.map((o,i)=>{ let cl='qopt Q'+'ABCD'[i]; if(q.closed) cl+=i===q.correct?' good':' dim'; const tags=q.closed?Object.entries(q.picks).filter(([,v])=>v===i).map(([k])=>`<span style="--c:${S.teams[k].color}"></span>`).join(''):''; return `<div class="${cl}"><span class="L">${'ABCD'[i]}</span><span>${esc(o)}</span><span class="tags">${tags}</span></div>`; }).join('')}</div>
        <div class="sub">${q.closed?S.teams.map((t,i)=>q.gain[i]?`${esc(t.name)} ${q.gain[i]}`:'').filter(Boolean).join(' · '):`Ont répondu : ${q.answered.map(i=>esc(S.teams[i].name)).join(', ')||'personne pour l\'instant'}`}</div>`;
    } else if(S.answer) mid=`<div class="answer"><div class="sub">La réponse était…</div><div class="huge gold">${esc(S.answer.t)}</div><div class="mid">${esc(S.answer.a)} · ${S.answer.y}</div></div>`;
    else mid=`<div class="sub">${esc(S.round)}</div><div class="mid">Titre n°${S.trackNo}</div>${S.fx?`<div class="mid" style="color:var(--rose)">⚡ ${S.fx==='rev'?'À l\'envers':'Version accélérée ×'+S.fx} !</div>`:''}<div id="tchr" class="huge"></div>${S.status==='open'?'<div class="mid" style="color:var(--ok)">🔓 Buzzers ouverts !</div>':''}${S.blocked.length?`<div class="sub">Bloquées : ${S.blocked.map(i=>esc(S.teams[i].name)).join(', ')}</div>`:''}`;
    tv.innerHTML=LOGO()+`<div class="stage">${mid}</div>`+scores()+(S.status==='buzzed'&&S.buzz?`<div class="buzzfull" style="--c:${S.teams[S.buzz.team].color}"><div class="mid">🔔 BUZZ !</div><div class="huge">${esc(S.buzz.name)}</div><div class="mid">${esc(S.teams[S.buzz.team].name)}</div></div>`:'');
    // quand le clip est affiché, on laisse juste un bandeau réponse en bas
    tv.style.opacity=ytl.classList.contains('show')&&S.answer&&!S.qcm?'0':'1';
    if(ytl.classList.contains('show')&&S.answer){ $('#ban').innerHTML=`<div class="b" data-ans="1" style="--c:#1c0a15cc;animation:pop .4s;white-space:normal;text-align:center">${esc(S.answer.t)} · ${esc(S.answer.a)} (${S.answer.y})</div>`; }
    else if($('#ban [data-ans]')) $('#ban').innerHTML='';
  }
  // garder l'affichage cohérent quand le clip apparaît/disparaît
  new MutationObserver(()=>{ if(S) render(); }).observe(ytl,{attributes:true,attributeFilter:['class']});
}
</script></body></html>
